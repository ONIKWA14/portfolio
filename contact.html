<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Onikwa Babu.">
  <title>Contact | Onikwa Babu</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">OB<span class="dot">.</span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">
        <span class="nav-toggle-icon" aria-hidden="true">☰</span>
        <span class="visually-hidden">Menu</span>
      </button>
      <nav id="primary-nav" class="nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html/index.html">About</a></li>
          <li><a href="project.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-pressed="false">
        <span aria-hidden="true">🌙</span>
        <span class="visually-hidden">Toggle dark mode</span>
      </button>
    </div>
  </header>

  <main id="main" class="container section">
    <h1>Contact</h1>
    <p class="lead">Have a project in mind, or just want to say hello? Send a message below.</p>
    <p class="lead">This form validates in your browser but does not send messages yet.</p>

    <form class="contact-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required aria-describedby="name-error">
        <p id="name-error" class="error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required aria-describedby="email-error">
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
        <p id="message-error" class="error" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn btn-primary">Send message</button>
      <p id="form-status" class="form-status" aria-live="polite"></p>
    </form>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Onikwa Babu. Built with HTML, CSS &amp; JavaScript.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
